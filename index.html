<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1d12" />
    <title>Knights &amp; Dragons</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="pill stats">
        <span title="Lives">❤️ <b id="lives">20</b></span>
        <span title="Gold">🪙 <b id="gold">0</b></span>
        <span title="Wave">🐉 <b id="wave">0/0</b></span>
      </div>
      <div class="controls">
        <button id="speed" class="pill round" aria-label="Game speed">1×</button>
        <button id="pause" class="pill round" aria-label="Pause">❚❚</button>
      </div>
    </div>

    <button id="callWave" class="pill call" hidden></button>
    <div id="menu" hidden></div>
    <div id="banner" hidden></div>
    <div id="overlay" hidden><div class="card" id="card"></div></div>
    <div id="rotate"><div>📱↻</div><p>Turn your phone sideways to play.</p></div>
    <div id="version"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
